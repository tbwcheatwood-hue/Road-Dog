<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/><stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/><stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text x="600" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#F7F7F4" text-anchor="middle">Get Started in Three Steps</text>

  <!-- Step 1 -->
  <rect x="60" y="90" width="340" height="160" fill="url(#card)" stroke="#333" rx="16"/>
  <rect x="60" y="90" width="6" height="160" fill="url(#accent)" rx="16"/>
  <circle cx="85" cy="130" r="22" fill="url(#accent)"/>
  <text x="85" y="136" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#F7F7F4" text-anchor="middle">1</text>
  <text x="190" y="160" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#F7F7F4" text-anchor="middle">Install</text>
  <text x="190" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#A1A1AA" text-anchor="middle" width="300">pip install -e . --no-deps && pip install -r requirements.txt</text>
  <text x="190" y="218" font-family="system-ui, sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Copy .env and jarvis.toml from examples</text>

  <!-- Step 2 -->
  <rect x="430" y="90" width="340" height="160" fill="url(#card)" stroke="#333" rx="16"/>
  <rect x="430" y="90" width="6" height="160" fill="url(#accent)" rx="16"/>
  <circle cx="455" cy="130" r="22" fill="url(#accent)"/>
  <text x="455" y="136" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#F7F7F4" text-anchor="middle">2</text>
  <text x="600" y="160" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#F7F7F4" text-anchor="middle">Launch</text>
  <text x="600" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#A1A1AA" text-anchor="middle" width="300">jarvis serve   (headless, http://localhost:8442)</text>
  <text x="600" y="218" font-family="system-ui, sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Or double-click the Hue desktop shortcut</text>

  <!-- Step 3 -->
  <rect x="800" y="90" width="340" height="160" fill="url(#card)" stroke="#333" rx="16"/>
  <rect x="800" y="90" width="6" height="160" fill="url(#accent)" rx="16"/>
  <circle cx="825" cy="130" r="22" fill="url(#accent)"/>
  <text x="825" y="136" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#F7F7F4" text-anchor="middle">3</text>
  <text x="970" y="160" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#F7F7F4" text-anchor="middle">Connect</text>
  <text x="970" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#A1A1AA" text-anchor="middle" width="300">Open API Keys &amp; Providers in the app. Add your model key or local Ollama.</text>
  <text x="970" y="218" font-family="system-ui, sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Credentials stay in-app — never in config files</text>

  <!-- Arrows -->
  <line x1="400" y1="170" x2="430" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="170" x2="800" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Coding agents bar -->
  <rect x="60" y="290" width="1080" height="140" fill="url(#card)" stroke="#333" rx="16"/>
  <text x="600" y="322" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#F7F7F4" text-anchor="middle">Coding Agents Ready to Launch</text>
  <text x="600" y="352" font-family="system-ui, sans-serif" font-size="13.5" fill="#A1A1AA" text-anchor="middle">Claude Code · Codex · OpenCode · Cursor · Kimi Code · GLM · Grok Build · DeepSeek Harness · Kilo Code · Zed Code</text>
  <text x="600" y="384" font-family="system-ui, sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Set KILOCODE_API_KEY / ZCODE_API_KEY to enable Kilo Code and Zed Code (degrade safely when unset)</text>

  <text x="600" y="485" font-family="system-ui, sans-serif" font-size="14" fill="#666" text-anchor="middle">Hue · open-source AI agent super-app · https://github.com/tbwcheatwood-hue/Road-Dog</text>
</svg>
