<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A4BFF"/>
      <stop offset="100%" stop-color="#4A1DFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <text x="60" y="80" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Road Dog Architecture</text>
  <text x="60" y="120" fill="#A1A1A1" font-family="system-ui, sans-serif" font-size="18">Core engine · Agentic IDE · The Crew · Voice · Computer Use · Marketplace · Memory</text>
  <!-- Boxes -->
  <rect x="60" y="180" width="200" height="120" rx="12" fill="#1F1F1F" stroke="url(#accent)" stroke-width="2"/>
  <text x="160" y="245" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Core Engine</text>
  <rect x="300" y="180" width="200" height="120" rx="12" fill="#1F1F1F" stroke="url(#accent)" stroke-width="2"/>
  <text x="400" y="245" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Agentic IDE</text>
  <rect x="540" y="180" width="200" height="120" rx="12" fill="#1F1F1F" stroke="url(#accent)" stroke-width="2"/>
  <text x="640" y="245" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">The Crew</text>
  <rect x="780" y="180" width="200" height="120" rx="12" fill="#1F1F1F" stroke="url(#accent)" stroke-width="2"/>
  <text x="880" y="245" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Voice + CU</text>
  <rect x="300" y="360" width="440" height="120" rx="12" fill="#1F1F1F" stroke="url(#accent)" stroke-width="2"/>
  <text x="520" y="425" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Marketplace · Memory · Sam(wise)</text>
  <text x="60" y="540" fill="#8A4BFF" font-family="system-ui, sans-serif" font-size="14">Your AI. Your crew. Your road.</text>
</svg>
