<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roaddog-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A4BFF"/>
      <stop offset="100%" stop-color="#4A1DFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background: graphite black -->
  <rect width="512" height="512" fill="#0A0A0A" rx="64"/>
  
  <!-- Charcoal road element -->
  <path d="M 64 320 Q 256 320 256 200 Q 256 80 320 80 L 448 80 Q 512 80 512 144 L 512 368 Q 512 432 448 432 L 320 432 Q 256 432 256 320 L 64 320 Z" fill="#1A1A1A"/>
  
  <!-- Road lines (electric purple) -->
  <path d="M 100 300 Q 256 300 256 180 Q 256 100 300 100 L 400 100 Q 440 100 440 140 L 440 360 Q 440 400 400 400 L 300 400 Q 256 400 256 320 L 100 320 Q 60 320 60 280" stroke="#8A4BFF" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Dog paw print -->
  <g transform="translate(256, 256)">
    <!-- Main paw pad -->
    <circle cx="0" cy="0" r="28" fill="url(#roaddog-grad)"/>
    <!-- Toe beans -->
    <circle cx="-24" cy="-20" r="14" fill="url(#roaddog-grad)"/>
    <circle cx="-8" cy="-28" r="14" fill="url(#roaddog-grad)"/>
    <circle cx="8" cy="-28" r="14" fill="url(#roaddog-grad)"/>
    <circle cx="24" cy="-20" r="14" fill="url(#roaddog-grad)"/>
    <!-- Sam's eye (wise companion) -->
    <circle cx="0" cy="4" r="10" fill="#0A0A0A"/>
    <circle cx="2" cy="2" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- Tagline -->
  <text x="256" y="460" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#8A4BFF" text-anchor="middle">ROAD DOG</text>
  <text x="256" y="490" font-family="Inter, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Samwise is online</text>
</svg>
